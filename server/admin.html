<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AccuScan Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f7;color:#1d1d1f;font-size:14px}
header{background:#fff;border-bottom:1px solid #e5e5ea;padding:16px 24px;display:flex;align-items:center;gap:16px}
header h1{font-size:18px;font-weight:700;color:#1d1d1f}
header .badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;background:#0078f0;color:#fff}
.container{max-width:1200px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat{background:#fff;border-radius:12px;padding:16px;border:1px solid #e5e5ea}
.stat-label{font-size:11px;color:#8e8e93;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:28px;font-weight:700;margin-top:4px;color:#1d1d1f}
.card{background:#fff;border-radius:12px;border:1px solid #e5e5ea;margin-bottom:24px;overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid #e5e5ea;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-header h2{font-size:15px;font-weight:600;flex:1}
.filters{display:flex;gap:8px;flex-wrap:wrap}
select,input{border:1px solid #e5e5ea;border-radius:8px;padding:6px 10px;font-size:13px;background:#fff;color:#1d1d1f;outline:none}
select:focus,input:focus{border-color:#0078f0}
button{border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-primary{background:#0078f0;color:#fff}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:#f5f5f7;color:#1d1d1f;border:1px solid #e5e5ea}
.btn-secondary:hover{background:#ebebeb}
.btn-danger{background:#ff3b30;color:#fff}
.btn-danger:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e5e5ea;background:#fafafa}
td{padding:11px 16px;border-bottom:1px solid #f2f2f7;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f9f9fb}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase}
.pill-free{background:#f5f5f7;color:#8e8e93}
.pill-solo{background:#e8f4ff;color:#0078f0}
.pill-team{background:#e8f9ef;color:#22c55e}
.pill-crew{background:#fff5e8;color:#f59e0b}
.pill-advocate{background:#fde8ff;color:#9333ea}
.pill-promoter{background:#e8f4ff;color:#0078f0}
.pill-user{background:#f5f5f7;color:#8e8e93}
.broadcast-form{padding:20px;display:grid;gap:12px}
.broadcast-form label{font-size:12px;font-weight:600;color:#8e8e93;display:block;margin-bottom:4px}
.broadcast-form input,.broadcast-form textarea,.broadcast-form select{width:100%;border:1px solid #e5e5ea;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
.broadcast-form textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{padding:40px;text-align:center;color:#8e8e93}
.secret-bar{background:#fff;border-bottom:1px solid #e5e5ea;padding:10px 24px;display:flex;align-items:center;gap:10px}
.secret-bar label{font-size:12px;font-weight:600;color:#8e8e93}
.secret-bar input{flex:1;max-width:320px}
.pill-ok{background:#e8f9ef;color:#1e9e57}
.pill-bad{background:#ffecec;color:#d92d20}
.pill-wait{background:#fff5e8;color:#b45309}
.toast{position:fixed;bottom:24px;right:24px;background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
#loading{text-align:center;padding:40px;color:#8e8e93}
</style>
</head>
<body>

<div class="secret-bar">
  <label>Admin secret:</label>
  <input type="password" id="secretInput" placeholder="ADMIN_SECRET value" oninput="loadData()"/>
</div>

<header>
  <h1>AccuScan Admin</h1>
  <span class="badge" id="totalBadge">Loading…</span>
</header>

<div class="container">
  <!-- Stats row -->
  <div class="stats" id="stats"></div>

  <!-- Pilot sign-ups (landing page funnel) -->
  <div class="card">
    <div class="card-header">
      <h2>Pilot sign-ups</h2>
      <div class="filters">
        <input type="text" id="pilotSearch" placeholder="Search email / campaign…" oninput="renderPilot()"/>
        <button class="btn-secondary btn-sm" onclick="exportPilotCSV()">⬇ CSV</button>
      </div>
    </div>
    <div class="stats" id="pilotStats" style="padding:16px 20px 0;margin-bottom:8px"></div>
    <div id="pilotWrap" style="overflow-x:auto">
      <div class="empty">Enter your admin secret above to load sign-ups.</div>
    </div>
  </div>

  <!-- Users table -->
  <div class="card">
    <div class="card-header">
      <h2>Users</h2>
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search email / UID…" oninput="renderTable()"/>
        <select id="tierFilter" onchange="renderTable()">
          <option value="">All tiers</option>
          <option>free</option><option>solo</option><option>team</option><option>crew</option>
        </select>
        <select id="tradeFilter" onchange="renderTable()">
          <option value="">All trades</option>
          <option>plumber</option><option>plasterer</option><option>builder</option>
          <option>carpenter</option><option>decorator</option><option>general</option>
        </select>
        <select id="engFilter" onchange="renderTable()">
          <option value="">All engagement</option>
          <option>advocate</option><option>promoter</option><option>user</option>
        </select>
        <button class="btn-secondary btn-sm" onclick="exportCSV()">⬇ CSV</button>
      </div>
    </div>
    <div id="tableWrap">
      <div id="loading">Enter your admin secret above to load data.</div>
    </div>
  </div>

  <!-- Broadcast -->
  <div class="card">
    <div class="card-header">
      <h2>Broadcast Notification</h2>
    </div>
    <form class="broadcast-form" onsubmit="sendBroadcast(event)">
      <div>
        <label>Title</label>
        <input type="text" id="bTitle" placeholder="e.g. New feature in AccuScan" required/>
      </div>
      <div>
        <label>Message</label>
        <textarea id="bBody" placeholder="Message body shown in the notification…" required></textarea>
      </div>
      <div class="form-row">
        <div>
          <label>Target tier</label>
          <select id="bTier">
            <option value="all">All users</option>
            <option value="free">Free only</option>
            <option value="solo">Solo</option>
            <option value="team">Team</option>
            <option value="crew">Crew</option>
          </select>
        </div>
        <div>
          <label>Target trade</label>
          <select id="bTrade">
            <option value="all">All trades</option>
            <option value="plumber">Plumber</option>
            <option value="plasterer">Plasterer</option>
            <option value="builder">Builder</option>
            <option value="carpenter">Carpenter</option>
            <option value="decorator">Decorator</option>
          </select>
        </div>
      </div>
      <div>
        <button type="submit" class="btn-primary">Send Broadcast</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allUsers = [];
let lastSecret = '';

// Escape user-controlled values before interpolating into innerHTML. Without this,
// a user who signs up with an email/trade like "<img src=x onerror=...>" gets their
// payload executed in the admin's browser (stored XSS).
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function getSecret() {
  return document.getElementById('secretInput').value.trim();
}

async function loadData() {
  const secret = getSecret();
  if (!secret || secret === lastSecret) return;
  lastSecret = secret;
  loadPilot(secret);

  document.getElementById('loading').textContent = 'Loading…';
  document.getElementById('tableWrap').innerHTML = '<div id="loading">Loading…</div>';

  try {
    // /api/admin/users is paginated (200/page max) so a single dashboard
    // load can never trigger an unbounded Firestore scan. The dashboard's
    // UX is still "see everyone" though, so walk every page here — a
    // handful of sequential requests, not one unbounded one server-side.
    allUsers = [];
    let cursor = null, cursorUid = null;
    for (;;) {
      const url = new URL('/api/admin/users', window.location.origin);
      url.searchParams.set('limit', '200');
      if (cursor !== null) {
        url.searchParams.set('cursor', cursor);
        url.searchParams.set('cursorUid', cursorUid);
      }
      const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + secret } });
      if (!res.ok) {
        document.getElementById('tableWrap').innerHTML = `<div class="empty">Error ${res.status}: ${esc((await res.json()).error)}</div>`;
        return;
      }
      const data = await res.json();
      allUsers = allUsers.concat(data.users || []);
      document.getElementById('loading').textContent = `Loading… (${allUsers.length} so far)`;
      if (!data.hasMore) break;
      cursor = data.nextCursor;
      cursorUid = data.nextCursorUid;
    }
    renderStats();
    renderTable();
    document.getElementById('totalBadge').textContent = allUsers.length + ' users';
  } catch (e) {
    document.getElementById('tableWrap').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function renderStats() {
  const byTier = { free:0, solo:0, team:0, crew:0 };
  const byEng  = { advocate:0, promoter:0, user:0 };
  let totalScans = 0;

  allUsers.forEach(u => {
    byTier[u.tier] = (byTier[u.tier] || 0) + 1;
    byEng[u.engagementTier] = (byEng[u.engagementTier] || 0) + 1;
    totalScans += Number(u.totalScans || 0);
  });

  const stats = [
    { label: 'Total users', value: allUsers.length },
    { label: 'Paid', value: (byTier.solo||0)+(byTier.team||0)+(byTier.crew||0) },
    { label: 'Free', value: byTier.free || 0 },
    { label: 'Advocates', value: byEng.advocate || 0 },
    { label: 'Promoters', value: byEng.promoter || 0 },
    { label: 'Total scans', value: totalScans },
  ];

  document.getElementById('stats').innerHTML = stats.map(s => `
    <div class="stat">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value">${s.value.toLocaleString()}</div>
    </div>
  `).join('');
}

function renderTable() {
  const search  = document.getElementById('searchInput').value.toLowerCase();
  const tier    = document.getElementById('tierFilter').value;
  const trade   = document.getElementById('tradeFilter').value;
  const eng     = document.getElementById('engFilter').value;

  let rows = allUsers.filter(u => {
    if (search && !u.email.toLowerCase().includes(search) && !u.uid.toLowerCase().includes(search)) return false;
    if (tier  && u.tier !== tier)  return false;
    if (trade && u.trade !== trade) return false;
    if (eng   && u.engagementTier !== eng) return false;
    return true;
  });

  if (!rows.length) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty">No users match filters.</div>';
    return;
  }

  const html = `
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Trade</th>
          <th>Tier</th>
          <th>Engagement</th>
          <th>Scans</th>
          <th>Last active</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(u => `
          <tr>
            <td style="font-size:13px">${u.email ? esc(u.email) : '<span style="color:#8e8e93">'+esc(u.uid.slice(0,12))+'…</span>'}</td>
            <td>${u.trade ? esc(u.trade) : '–'}</td>
            <td><span class="pill pill-${esc(u.tier)}">${esc(u.tier)}</span></td>
            <td><span class="pill pill-${esc(u.engagementTier)}">${esc(u.engagementTier)}</span></td>
            <td style="font-variant-numeric:tabular-nums">${u.totalScans || 0}</td>
            <td style="color:#8e8e93;font-size:12px">${formatDate(u.lastActive)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
  document.getElementById('tableWrap').innerHTML = html;
}

function formatDate(iso) {
  if (!iso) return '–';
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

async function exportCSV() {
  const secret = getSecret();
  if (!secret) { toast('Enter admin secret first'); return; }
  window.open('/api/admin/users.csv', '_blank');
}

async function sendBroadcast(e) {
  e.preventDefault();
  const secret = getSecret();
  if (!secret) { toast('Enter admin secret first'); return; }

  const title      = document.getElementById('bTitle').value;
  const body       = document.getElementById('bBody').value;
  const targetTier  = document.getElementById('bTier').value;
  const targetTrade = document.getElementById('bTrade').value;

  try {
    const res = await fetch('/api/admin/broadcast', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + secret,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ title, body, targetTier, targetTrade }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    toast('Broadcast sent — ID: ' + data.broadcastId);
    document.getElementById('bTitle').value = '';
    document.getElementById('bBody').value  = '';
  } catch (err) {
    toast('Error: ' + err.message);
  }
}

// ── Pilot sign-ups ──────────────────────────────────────────────────────────
let pilotRows = [];

async function loadPilot(secret) {
  const wrap = document.getElementById('pilotWrap');
  wrap.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const res = await fetch('/api/admin/pilot-signups', { headers: { 'Authorization': 'Bearer ' + secret } });
    if (!res.ok) {
      wrap.innerHTML = `<div class="empty">Error ${res.status}: ${esc((await res.json().catch(() => ({}))).error)}</div>`;
      return;
    }
    pilotRows = (await res.json()).signups || [];
    renderPilot();
  } catch (e) {
    wrap.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function pilotStatusPill(s) {
  if (s === 'subscribed' || s === 'already_subscribed') return `<span class="pill pill-ok">${esc(s)}</span>`;
  if (s === 'pending') return '<span class="pill pill-wait">pending</span>';
  return `<span class="pill pill-bad">${esc(s || 'unknown')}</span>`;
}

function renderPilot() {
  const today = new Date().toISOString().slice(0, 10);
  const weekAgo = Date.now() - 7 * 864e5;
  const failed = pilotRows.filter(r => !['subscribed', 'already_subscribed'].includes(r.beehiivStatus)).length;
  const fromAds = pilotRows.filter(r => r.utm_source || r.fbclid || r.gclid).length;
  document.getElementById('pilotStats').innerHTML = [
    ['Total sign-ups', pilotRows.length],
    ['Today', pilotRows.filter(r => r.createdAt.startsWith(today)).length],
    ['Last 7 days', pilotRows.filter(r => r.createdAt && Date.parse(r.createdAt) >= weekAgo).length],
    ['From ads', fromAds],
    ['Not in Beehiiv', failed],
  ].map(([l, v]) => `<div class="stat"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`).join('');

  const q = document.getElementById('pilotSearch').value.trim().toLowerCase();
  const rows = q ? pilotRows.filter(r => [r.email, r.utm_source, r.utm_campaign, r.utm_content].join(' ').toLowerCase().includes(q)) : pilotRows;
  if (!rows.length) {
    document.getElementById('pilotWrap').innerHTML = '<div class="empty">No pilot sign-ups yet.</div>';
    return;
  }
  document.getElementById('pilotWrap').innerHTML = `
    <table>
      <thead><tr><th>Signed up</th><th>Email</th><th>Source</th><th>Campaign</th><th>Ad</th><th>Beehiiv</th></tr></thead>
      <tbody>${rows.map(r => `
        <tr>
          <td style="white-space:nowrap">${r.createdAt ? esc(new Date(r.createdAt).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })) : '–'}</td>
          <td>${esc(r.email)}</td>
          <td>${esc(r.utm_source || r.source)}${r.fbclid ? ' · fb' : ''}${r.gclid ? ' · google' : ''}</td>
          <td>${esc(r.utm_campaign || '–')}</td>
          <td>${esc(r.utm_content || '–')}</td>
          <td>${pilotStatusPill(r.beehiivStatus)}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

// Built in the browser so the download carries the admin secret's auth —
// a plain link to an admin endpoint can't send the Authorization header.
function exportPilotCSV() {
  if (!pilotRows.length) { toast('No sign-ups loaded yet'); return; }
  const cols = ['createdAt', 'email', 'source', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'fbclid', 'gclid', 'beehiivStatus', 'submitCount'];
  const csv = cols.join(',') + '\n' + pilotRows.map(r =>
    cols.map(c => `"${String(r[c] ?? '').replace(/"/g, '""')}"`).join(',')
  ).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `pilot-signups-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3500);
}

// Note: the admin secret is intentionally NOT read from the URL query string.
// A secret in the URL leaks into browser history, server access logs, and Referer
// headers. The admin must type it into the field each session.
</script>
</body>
</html>
